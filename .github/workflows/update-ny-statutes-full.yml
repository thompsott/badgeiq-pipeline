name: Update NY Statutes (Full)

on:
  schedule:
    - cron: "0 15 * * 0" # weekly, Sundays — this is a much larger/slower pull
  workflow_dispatch:

jobs:
  fetch-and-upsert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch full NY statute tree and update Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NY_SENATE_API_KEY: ${{ secrets.NY_SENATE_API_KEY }}
        run: node scripts/fetch-ny-statutes-full.js
